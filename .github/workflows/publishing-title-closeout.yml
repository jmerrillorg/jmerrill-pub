name: Publishing Title Closeout

on:
  workflow_dispatch:
    inputs:
      title:
        description: Human-readable title label for operator confirmation.
        required: true
        default: The Intentional Leader
      title_id:
        description: Governed title record ID.
        required: true
        default: e797232b-da7a-f111-ab0f-00224820105b
      stage_id:
        description: Current editorial stage record ID.
        required: true
        default: c9dee533-4184-f111-ab0f-7c1e525b15c2
      gate_id:
        description: Current author approval gate record ID.
        required: true
        default: 5141f7db-0a8e-f111-8077-00224820105b
      approved_artifact_id:
        description: Current artifact/version approved by the author.
        required: true
        default: intentional-leader-final-pagination-corrected-proof-2026-08-03-v1
      approved_artifact_checksum:
        description: SHA-256 checksum of current approved artifact.
        required: true
        default: 0138d7a474cc4ab2d8369b4ae0642842d8bdbd041ec9029347b15daf051975ed
      approval_source:
        description: Governed source of explicit final author approval.
        required: true
        default: jackie-author-approval-confirmed
      approval_timestamp:
        description: Timestamp of explicit final author approval.
        required: true
        default: "2026-08-03T00:00:00Z"
      author_approval_semantic:
        description: Final approval semantic for this closeout.
        required: true
        default: APPROVED
        type: choice
        options:
          - APPROVED
          - APPROVED_WITH_CORRECTIONS
          - CHANGES_REQUESTED
          - REVISED_FOR_AUTHOR_REVIEW
          - QUESTIONS
          - REVIEW_REQUIRED
      current_stage_artifact_version:
        description: Current stage artifact/version expected for closeout.
        required: true
        default: intentional-leader-final-pagination-corrected-proof-2026-08-03-v1
      approved_artifact_version:
        description: Artifact/version actually approved by author.
        required: true
        default: intentional-leader-final-pagination-corrected-proof-2026-08-03-v1
      unresolved_author_corrections:
        description: Count of unresolved author-requested corrections.
        required: true
        default: "0"
      required_internal_verification:
        description: Internal verification state.
        required: true
        default: COMPLETE
        type: choice
        options:
          - COMPLETE
          - IN_PROGRESS
          - NOT_STARTED
      expected_current_stage:
        description: Expected current stage type or label.
        required: true
        default: INTERIOR_LAYOUT
      expected_gate_state:
        description: Expected gate state label.
        required: true
        default: READY_FOR_AUTHOR_RELEASE
      expected_active_gate_count:
        description: Expected active canonical gate count.
        required: true
        default: "1"
      expected_response_clock_count:
        description: Expected response clock count.
        required: true
        default: "0"
      next_stage:
        description: Exact next stage after closeout.
        required: true
        default: Cover Design
      dry_run:
        description: Run read-only dry-run.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      confirm:
        description: Execute confirmed mutation after dry-run.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      expected_production_release:
        description: Production release SHA expected before invocation.
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publishing-title-closeout
  cancel-in-progress: false

env:
  PRODUCTION_HEALTH_URL: https://jmerrill.pub/api/health
  TITLE_CLOSEOUT_URL: https://jmerrill.pub/api/publishing/title-closeout

jobs:
  closeout:
    name: Protected title closeout
    runs-on: ubuntu-latest
    environment: jmerrill-pub-production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Commissioned Bootstrap Gate
        run: |
          set -euo pipefail
          npm ci
          npm run jm1-bootstrap -- --initiative "Protected Publishing Title Closeout Executor" --mode "production-mutation"
          npm run jm1-bootstrap-guard
          npm run jm1-canon-consistency-guard
          npm run jm1-canon-guard-enforcement
          npm run jm1-commissioning-guard

      - name: Verify Production Release
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -fsS -o "$body" -w '%{http_code}' --max-time 20 "$PRODUCTION_HEALTH_URL" || true)"
          if [ "$code" != "200" ]; then
            echo "Production health returned HTTP $code." >&2
            exit 1
          fi
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (h.status !== 'ready' || h.release !== process.argv[2]) process.exit(1)" "$body" "${{ inputs.expected_production_release }}"

      - name: Obtain GitHub OIDC Identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jm1-pub-title-closeout")"
          OIDC_JWT="$(jq -r '.value' <<<"${OIDC_RESPONSE}")"
          if [[ -z "${OIDC_JWT}" || "${OIDC_JWT}" == "null" ]]; then
            echo "OIDC request failed." >&2
            exit 1
          fi
          {
            echo "token<<EOF"
            echo "${OIDC_JWT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Invoke Dry Run
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -cn \
            --arg titleId "${{ inputs.title_id }}" \
            --arg stageId "${{ inputs.stage_id }}" \
            --arg gateId "${{ inputs.gate_id }}" \
            --arg approvedArtifactId "${{ inputs.approved_artifact_id }}" \
            --arg approvedArtifactChecksum "${{ inputs.approved_artifact_checksum }}" \
            --arg approvalSource "${{ inputs.approval_source }}" \
            --arg approvalTimestamp "${{ inputs.approval_timestamp }}" \
            --arg authorApprovalSemantic "${{ inputs.author_approval_semantic }}" \
            --arg currentStageArtifactVersion "${{ inputs.current_stage_artifact_version }}" \
            --arg approvedArtifactVersion "${{ inputs.approved_artifact_version }}" \
            --arg unresolvedAuthorCorrections "${{ inputs.unresolved_author_corrections }}" \
            --arg requiredInternalVerification "${{ inputs.required_internal_verification }}" \
            --arg expectedCurrentStage "${{ inputs.expected_current_stage }}" \
            --arg expectedGateState "${{ inputs.expected_gate_state }}" \
            --arg expectedActiveGateCount "${{ inputs.expected_active_gate_count }}" \
            --arg expectedResponseClockCount "${{ inputs.expected_response_clock_count }}" \
            --arg nextStage "${{ inputs.next_stage }}" \
            '{
              titleId: $titleId,
              stageId: $stageId,
              gateId: $gateId,
              approvedArtifactId: $approvedArtifactId,
              approvedArtifactChecksum: $approvedArtifactChecksum,
              approvalSource: $approvalSource,
              approvalTimestamp: $approvalTimestamp,
              authorApprovalSemantic: $authorApprovalSemantic,
              currentStageArtifactVersion: $currentStageArtifactVersion,
              approvedArtifactVersion: $approvedArtifactVersion,
              unresolvedAuthorCorrections: ($unresolvedAuthorCorrections | tonumber),
              requiredInternalVerification: $requiredInternalVerification,
              expectedCurrentStage: $expectedCurrentStage,
              expectedGateState: $expectedGateState,
              expectedActiveGateCount: ($expectedActiveGateCount | tonumber),
              expectedResponseClockCount: ($expectedResponseClockCount | tonumber),
              dryRun: true,
              confirm: false,
              nextStage: $nextStage
            }')"
          curl -fsS \
            -X POST "$TITLE_CLOSEOUT_URL" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "$BODY" | tee title-closeout-dry-run.json
          grep -q '"status":"eligible"' title-closeout-dry-run.json

      - name: Invoke Confirmed Closeout
        if: inputs.confirm == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -cn \
            --arg titleId "${{ inputs.title_id }}" \
            --arg stageId "${{ inputs.stage_id }}" \
            --arg gateId "${{ inputs.gate_id }}" \
            --arg approvedArtifactId "${{ inputs.approved_artifact_id }}" \
            --arg approvedArtifactChecksum "${{ inputs.approved_artifact_checksum }}" \
            --arg approvalSource "${{ inputs.approval_source }}" \
            --arg approvalTimestamp "${{ inputs.approval_timestamp }}" \
            --arg authorApprovalSemantic "${{ inputs.author_approval_semantic }}" \
            --arg currentStageArtifactVersion "${{ inputs.current_stage_artifact_version }}" \
            --arg approvedArtifactVersion "${{ inputs.approved_artifact_version }}" \
            --arg unresolvedAuthorCorrections "${{ inputs.unresolved_author_corrections }}" \
            --arg requiredInternalVerification "${{ inputs.required_internal_verification }}" \
            --arg expectedCurrentStage "${{ inputs.expected_current_stage }}" \
            --arg expectedGateState "${{ inputs.expected_gate_state }}" \
            --arg expectedActiveGateCount "${{ inputs.expected_active_gate_count }}" \
            --arg expectedResponseClockCount "${{ inputs.expected_response_clock_count }}" \
            --arg nextStage "${{ inputs.next_stage }}" \
            '{
              titleId: $titleId,
              stageId: $stageId,
              gateId: $gateId,
              approvedArtifactId: $approvedArtifactId,
              approvedArtifactChecksum: $approvedArtifactChecksum,
              approvalSource: $approvalSource,
              approvalTimestamp: $approvalTimestamp,
              authorApprovalSemantic: $authorApprovalSemantic,
              currentStageArtifactVersion: $currentStageArtifactVersion,
              approvedArtifactVersion: $approvedArtifactVersion,
              unresolvedAuthorCorrections: ($unresolvedAuthorCorrections | tonumber),
              requiredInternalVerification: $requiredInternalVerification,
              expectedCurrentStage: $expectedCurrentStage,
              expectedGateState: $expectedGateState,
              expectedActiveGateCount: ($expectedActiveGateCount | tonumber),
              expectedResponseClockCount: ($expectedResponseClockCount | tonumber),
              dryRun: false,
              confirm: true,
              nextStage: $nextStage
            }')"
          curl -fsS \
            -X POST "$TITLE_CLOSEOUT_URL" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "$BODY" | tee title-closeout-confirmed.json
          grep -q '"status":"completed"' title-closeout-confirmed.json

      - name: Idempotency Readback
        if: inputs.confirm == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(jq -cn \
            --arg titleId "${{ inputs.title_id }}" \
            --arg stageId "${{ inputs.stage_id }}" \
            --arg gateId "${{ inputs.gate_id }}" \
            --arg approvedArtifactId "${{ inputs.approved_artifact_id }}" \
            --arg approvedArtifactChecksum "${{ inputs.approved_artifact_checksum }}" \
            --arg approvalSource "${{ inputs.approval_source }}" \
            --arg approvalTimestamp "${{ inputs.approval_timestamp }}" \
            --arg authorApprovalSemantic "${{ inputs.author_approval_semantic }}" \
            --arg currentStageArtifactVersion "${{ inputs.current_stage_artifact_version }}" \
            --arg approvedArtifactVersion "${{ inputs.approved_artifact_version }}" \
            --arg unresolvedAuthorCorrections "${{ inputs.unresolved_author_corrections }}" \
            --arg requiredInternalVerification "${{ inputs.required_internal_verification }}" \
            --arg expectedCurrentStage "${{ inputs.expected_current_stage }}" \
            --arg expectedGateState "${{ inputs.expected_gate_state }}" \
            --arg expectedResponseClockCount "${{ inputs.expected_response_clock_count }}" \
            --arg nextStage "${{ inputs.next_stage }}" \
            '{
              titleId: $titleId,
              stageId: $stageId,
              gateId: $gateId,
              approvedArtifactId: $approvedArtifactId,
              approvedArtifactChecksum: $approvedArtifactChecksum,
              approvalSource: $approvalSource,
              approvalTimestamp: $approvalTimestamp,
              authorApprovalSemantic: $authorApprovalSemantic,
              currentStageArtifactVersion: $currentStageArtifactVersion,
              approvedArtifactVersion: $approvedArtifactVersion,
              unresolvedAuthorCorrections: ($unresolvedAuthorCorrections | tonumber),
              requiredInternalVerification: $requiredInternalVerification,
              expectedCurrentStage: $expectedCurrentStage,
              expectedGateState: $expectedGateState,
              expectedActiveGateCount: 0,
              expectedResponseClockCount: ($expectedResponseClockCount | tonumber),
              dryRun: false,
              confirm: true,
              nextStage: $nextStage
            }')"
          curl -fsS \
            -X POST "$TITLE_CLOSEOUT_URL" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.token }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "$BODY" | tee title-closeout-idempotency.json
          grep -q '"status":"idempotent"' title-closeout-idempotency.json

      - name: Preserve Closeout Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-title-closeout-evidence
          path: title-closeout-*.json
          if-no-files-found: ignore

name: Publishing Import Window Guard

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publishing-power-platform-solution-deploy.yml
      - .github/workflows/publishing-import-window-guard.yml
      - .github/tests/publishing-import-window.test.mjs
      - .github/workflows/publishing-fresh-title-role-deploy.yml
      - .github/tests/fresh-title-role-auth.test.mjs
      - scripts/dataverse-github-oidc-token*.mjs
      - scripts/reconcile-fresh-title-role-oidc*.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/publishing-power-platform-solution-deploy.yml
      - .github/workflows/publishing-import-window-guard.yml
      - .github/tests/publishing-import-window.test.mjs
      - .github/workflows/publishing-fresh-title-role-deploy.yml
      - .github/tests/fresh-title-role-auth.test.mjs
      - scripts/dataverse-github-oidc-token*.mjs
      - scripts/reconcile-fresh-title-role-oidc*.mjs

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test .github/tests/publishing-import-window.test.mjs
      - name: Test protected fresh-role authentication and readback
        run: node --test scripts/fresh_title_commissioning_role.test.mjs scripts/fresh-title-role-policy.test.mjs scripts/fresh-title-release-binding.test.mjs .github/tests/fresh-title-role-auth.test.mjs scripts/dataverse-github-oidc-token.test.mjs scripts/reconcile-fresh-title-role-oidc.test.mjs

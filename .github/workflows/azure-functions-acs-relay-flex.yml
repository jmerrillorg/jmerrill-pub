name: Deploy ACS Email Relay (Node 22)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "azure-functions/acs-email-relay/**"
      - ".github/workflows/azure-functions-acs-relay-flex.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: jm1-acs-email-relay-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  AZURE_RESOURCE_GROUP: rg-jm1-communications
  FUNCTION_APP_NAME: func-jm1-acs-email-relay
  FUNCTION_APP_WORKING_DIR: azure-functions/acs-email-relay
  PACKAGE_STORAGE_ACCOUNT: stjm1acsrelay
  PACKAGE_CONTAINER: function-releases

jobs:
  validate-and-deploy:
    name: Validate, Package, Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FUNCTION_APP_WORKING_DIR }}/package-lock.json

      - name: Verify Node 22
        run: |
          node_major=$(node -e "process.stdout.write(process.version.split('.')[0].slice(1))")
          if [ "$node_major" != "22" ]; then
            echo "FATAL: Node major must be 22, got $node_major"
            exit 1
          fi
          echo "Node version: $(node --version) — PASS"

      - name: Install dependencies
        working-directory: ${{ env.FUNCTION_APP_WORKING_DIR }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ env.FUNCTION_APP_WORKING_DIR }}
        run: npm test

      - name: Lint check
        working-directory: ${{ env.FUNCTION_APP_WORKING_DIR }}
        run: npm run lint

      - name: Audit
        working-directory: ${{ env.FUNCTION_APP_WORKING_DIR }}
        run: npm audit --audit-level=high

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Package function for zip deployment
        working-directory: ${{ env.FUNCTION_APP_WORKING_DIR }}
        run: |
          zip -r /tmp/acs-relay-${{ github.sha }}.zip . \
            --exclude "*.test.js" \
            --exclude "local.settings.*" \
            --exclude ".env*"
          ls -lh /tmp/acs-relay-${{ github.sha }}.zip

      - name: Deploy run-from-package to Function App
        run: |
          package_name="acs-relay-${{ github.sha }}.zip"
          package_path="/tmp/$package_name"
          expires_on=$(date -u -d "+10 years" "+%Y-%m-%dT%H:%MZ")
          account_key=$(az storage account keys list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --account-name "$PACKAGE_STORAGE_ACCOUNT" \
            --query "[0].value" \
            -o tsv)

          az storage blob upload \
            --account-name "$PACKAGE_STORAGE_ACCOUNT" \
            --container-name "$PACKAGE_CONTAINER" \
            --name "$package_name" \
            --file "$package_path" \
            --overwrite true \
            --account-key "$account_key" \
            -o none

          package_url=$(az storage blob url \
            --account-name "$PACKAGE_STORAGE_ACCOUNT" \
            --container-name "$PACKAGE_CONTAINER" \
            --name "$package_name" \
            --account-key "$account_key" \
            -o tsv)

          package_sas=$(az storage blob generate-sas \
            --account-name "$PACKAGE_STORAGE_ACCOUNT" \
            --container-name "$PACKAGE_CONTAINER" \
            --name "$package_name" \
            --permissions r \
            --expiry "$expires_on" \
            --https-only \
            --account-key "$account_key" \
            -o tsv)

          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --settings \
              "WEBSITE_RUN_FROM_PACKAGE=${package_url}?${package_sas}" \
              "ENABLE_ORYX_BUILD=false" \
              "SCM_DO_BUILD_DURING_DEPLOYMENT=false" \
              "WEBSITES_ENABLE_APP_SERVICE_STORAGE=false" \
              "WEBSITE_USE_PLACEHOLDER=0" \
              "JM1_RELEASE_SHA=${{ github.sha }}" \
              "JM1_PRODUCTION_RELEASE_SHA=${{ github.sha }}" \
            -o none

          az functionapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --linux-fx-version "Node|22" \
            -o none

          az functionapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            -o none

          echo "Package deployment: $package_name — PASS"

      - name: Verify deployed package provenance
        run: |
          package_name="acs-relay-${{ github.sha }}.zip"
          package_setting=$(az functionapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" \
            -o tsv)

          if [[ "$package_setting" != *"$package_name"* ]]; then
            echo "FATAL: WEBSITE_RUN_FROM_PACKAGE does not reference $package_name"
            exit 1
          fi

          echo "Package provenance: $package_name — PASS"

      - name: Verify Node 22 on deployed runtime
        run: |
          runtime=$(az functionapp config show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --query "linuxFxVersion" -o tsv)
          echo "Deployed runtime: $runtime"
          if [[ "$runtime" != *"Node|22"* && "$runtime" != *"NODE|22"* ]]; then
            echo "FATAL: Deployed runtime is not Node 22: $runtime"
            exit 1
          fi
          echo "Runtime proof: $runtime — PASS"

      - name: Host and route health check
        run: |
          sleep 45
          status=$(az functionapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --query "state" -o tsv)
          echo "Function App state: $status"
          if [ "$status" != "Running" ]; then
            echo "FATAL: Function App not Running after deployment"
            exit 1
          fi

          http_status=$(curl -sS -o /tmp/relay-health-body.txt -w "%{http_code}" \
            -X POST "https://${FUNCTION_APP_NAME}.azurewebsites.net/api/send-enterprise-governed-email" \
            -H "content-type: application/json" \
            --data '{"brand":"JM1","sourceRecord":"ci-health-check"}')

          echo "Unauthenticated route health status: $http_status"
          if [ "$http_status" != "401" ]; then
            echo "FATAL: Relay route did not return governed 401 health response"
            cat /tmp/relay-health-body.txt
            exit 1
          fi

          if ! grep -q "UNAUTHORIZED" /tmp/relay-health-body.txt; then
            echo "FATAL: Relay health response did not come from governed handler"
            cat /tmp/relay-health-body.txt
            exit 1
          fi

          echo "Host and route health: PASS"

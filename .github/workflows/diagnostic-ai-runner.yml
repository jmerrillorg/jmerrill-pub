name: Diagnostic AI Runner CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "azure-functions/diagnostic-ai-runner/**"
      - ".github/workflows/diagnostic-ai-runner.yml"
  push:
    branches:
      - main
    paths:
      - "azure-functions/diagnostic-ai-runner/**"
      - ".github/workflows/diagnostic-ai-runner.yml"

permissions:
  contents: read

env:
  FUNCTION_APP_NAME: func-jm1-diagnostic-ai-runner
  FUNCTION_APP_RESOURCE_GROUP: rg-jm1-ai
  FUNCTION_APP_PATH: azure-functions/diagnostic-ai-runner

jobs:
  validate-and-package:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: azure-functions/diagnostic-ai-runner/package-lock.json

      - name: Install dependencies
        working-directory: azure-functions/diagnostic-ai-runner
        run: npm ci

      - name: Run full package validation
        working-directory: azure-functions/diagnostic-ai-runner
        run: npm test

      - name: Build deterministic deployment package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_path="$RUNNER_TEMP/diagnostic-ai-runner.zip"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          git archive \
            --format=zip \
            --mtime="@$source_date_epoch" \
            --output="$package_path" \
            "$GITHUB_SHA:$FUNCTION_APP_PATH"

          test -f "$package_path"
          unzip -Z1 "$package_path" | sort > "$RUNNER_TEMP/package-files.txt"
          grep -Fx "host.json" "$RUNNER_TEMP/package-files.txt"
          grep -Fx "package.json" "$RUNNER_TEMP/package-files.txt"
          grep -Fx "package-lock.json" "$RUNNER_TEMP/package-files.txt"
          grep -Fx "src/functions/runStage0Diagnostic.js" "$RUNNER_TEMP/package-files.txt"
          if grep -Eq "(^|/)azure-functions/diagnostic-ai-runner/" "$RUNNER_TEMP/package-files.txt"; then
            echo "Package contains an incorrect nested source directory" >&2
            exit 1
          fi
          if grep -Eq "(^|/)(node_modules|test)/" "$RUNNER_TEMP/package-files.txt"; then
            echo "Package contains excluded development content" >&2
            exit 1
          fi
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Upload immutable deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-ai-runner-${{ github.sha }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy production Function App
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-package
    runs-on: ubuntu-latest
    environment:
      name: jmerrill-pub-production
      url: https://func-jm1-diagnostic-ai-runner.azurewebsites.net
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: diagnostic-ai-runner-${{ github.sha }}
          path: ${{ runner.temp }}/deploy

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App package
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ runner.temp }}/deploy/diagnostic-ai-runner.zip

      - name: Record deployed commit SHA
        shell: bash
        run: |
          set -euo pipefail
          az functionapp config appsettings set \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$FUNCTION_APP_RESOURCE_GROUP" \
            --settings \
              JM1_RELEASE_SHA="$GITHUB_SHA" \
              JM1_PRODUCTION_RELEASE_SHA="$GITHUB_SHA" \
            --output none

      - name: Run production health and readback checks
        shell: bash
        run: |
          set -euo pipefail
          evidence_path="$RUNNER_TEMP/diagnostic-ai-runner-readback.json"
          az functionapp show \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$FUNCTION_APP_RESOURCE_GROUP" \
            --query "{name:name,state:state,kind:kind,location:location,serverFarmId:serverFarmId,linuxFxVersion:siteConfig.linuxFxVersion}" \
            --output json > "$evidence_path"

          # App settings can take a short time to propagate after being set;
          # retry the readback rather than fail closed on a race.
          release_sha=""
          production_release_sha=""
          for attempt in 1 2 3 4 5 6; do
            release_sha="$(az functionapp config appsettings list \
              --name "$FUNCTION_APP_NAME" \
              --resource-group "$FUNCTION_APP_RESOURCE_GROUP" \
              --query "[?name=='JM1_RELEASE_SHA'].value | [0]" \
              --output tsv)"
            production_release_sha="$(az functionapp config appsettings list \
              --name "$FUNCTION_APP_NAME" \
              --resource-group "$FUNCTION_APP_RESOURCE_GROUP" \
              --query "[?name=='JM1_PRODUCTION_RELEASE_SHA'].value | [0]" \
              --output tsv)"
            if [ "$release_sha" = "$GITHUB_SHA" ] && [ "$production_release_sha" = "$GITHUB_SHA" ]; then
              break
            fi
            echo "Release SHA not yet propagated (attempt $attempt); retrying in 10s..."
            sleep 10
          done
          test "$release_sha" = "$GITHUB_SHA"
          test "$production_release_sha" = "$GITHUB_SHA"
          printf '{"releaseSha":"%s","productionReleaseSha":"%s"}\n' "$release_sha" "$production_release_sha" \
            >> "$evidence_path"

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 30 \
              "https://$FUNCTION_APP_NAME.azurewebsites.net/api/health" \
              --output "$RUNNER_TEMP/diagnostic-ai-runner-health.json"; then
              break
            fi
            echo "Health check not yet ready (attempt $attempt); retrying in 10s..."
            sleep 10
          done
          cat "$RUNNER_TEMP/diagnostic-ai-runner-health.json"
          # The health endpoint must itself confirm the same release is live —
          # not just that the app setting was written.
          python3 -c "
import json,sys
with open('$RUNNER_TEMP/diagnostic-ai-runner-health.json') as f:
    body = json.load(f)
assert body.get('release') == '$GITHUB_SHA', f\"health endpoint reports release={body.get('release')!r}, expected $GITHUB_SHA\"
print('Health endpoint release matches deployed SHA — PASS')
"

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-ai-runner-deployment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/diagnostic-ai-runner-readback.json
            ${{ runner.temp }}/diagnostic-ai-runner-health.json
          if-no-files-found: warn
          retention-days: 90
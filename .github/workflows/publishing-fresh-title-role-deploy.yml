name: Publishing Disposable Local Role Sandbox
on:
  workflow_dispatch:
    inputs:
      package_base64:
        description: Reviewed disposable role-only fixture
        required: true
      package_sha256:
        description: Exact fixture SHA256
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: publishing-local-role-disposable-sandbox
  cancel-in-progress: false
env:
  DATAVERSE_ENVIRONMENT_URL: https://jm1test.crm.dynamics.com
  EXPECTED_ORGANIZATION_ID: bb7a9d9e-8e73-f111-b27b-000d3a31ff17
  SANDBOX_APPLICATION_ID: ad828303-3ce0-4bbb-8a6f-fbf410526b22
  SANDBOX_USER_ID: e20f91bb-a5c4-f111-aaad-7ced8d70583e
  SANDBOX_ROLE_ID: 7d151c32-7534-4ef4-8b91-9e76f5a9fe45
jobs:
  disposable-import:
    if: github.ref == 'refs/heads/codex/fresh-role-sandbox-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked validation dependencies
        working-directory: azure-functions/diagnostic-ai-runner
        run: npm ci --ignore-scripts
      - name: Validate isolated fixture before credentials
        env:
          FIXTURE_BASE64: ${{ inputs.package_base64 }}
          FIXTURE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          test "$FIXTURE_SHA256" = "b4819aefaea7394239562fa33b8e3afb399cc32564964c5a7aaf64c4cb7740a0"
          printf '%s' "$FIXTURE_BASE64" | base64 --decode > /tmp/fixture.zip
          printf '%s  /tmp/fixture.zip\n' "$FIXTURE_SHA256" | sha256sum --check --status
          unzip -p /tmp/fixture.zip solution.xml > /tmp/fixture-solution.xml
          unzip -p /tmp/fixture.zip customizations.xml > /tmp/fixture-customizations.xml
          node scripts/verify-local-role-sandbox.mjs package
      - uses: microsoft/powerplatform-actions/actions-install@v1
      - name: Authenticate disposable branch-bound identity
        run: |
          set -euo pipefail
          PAC_CLI="${POWERPLATFORMTOOLS_PACPATH:-pac}"
          "$PAC_CLI" auth create --name jm1-pub-local-sandbox --applicationId "$SANDBOX_APPLICATION_ID" --tenant 352d075e-8e17-4169-9f8e-22e6946ce66d --githubFederated --environment "$DATAVERSE_ENVIRONMENT_URL"
          TOKEN="$("$PAC_CLI" auth token)"
          echo "::add-mask::$TOKEN"
          DATAVERSE_ACCESS_TOKEN="$TOKEN" node scripts/verify-local-role-sandbox.mjs before
      - name: Import exactly one disposable managed role
        run: |
          set -euo pipefail
          PAC_CLI="${POWERPLATFORMTOOLS_PACPATH:-pac}"
          "$PAC_CLI" solution import --environment "$DATAVERSE_ENVIRONMENT_URL" --path /tmp/fixture.zip
      - name: Normalize and verify disposable imported role
        run: |
          set -euo pipefail
          PAC_CLI="${POWERPLATFORMTOOLS_PACPATH:-pac}"
          TOKEN="$("$PAC_CLI" auth token)"
          echo "::add-mask::$TOKEN"
          DATAVERSE_ACCESS_TOKEN="$TOKEN" node scripts/verify-local-role-sandbox.mjs after
      - name: Preserve acceptance receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publishing-local-role-sandbox-readback
          path: /tmp/local-role-sandbox-*.json
          if-no-files-found: warn

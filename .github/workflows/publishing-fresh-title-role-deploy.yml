name: Publishing Role Only Sandbox Acceptance
# Branch-only acceptance; never merge this override into main.
on:
  workflow_dispatch:
    inputs:
      fixture_base64:
        description: Exact isolated acceptance fixture bytes
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: publishing-role-only-native-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/codex/fresh-role-create-acceptance'
    environment: jmerrill-pub-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: microsoft/powerplatform-actions/actions-install@v1
      - name: Exact importer and isolated fixture preflight
        env:
          FIXTURE_BASE64: ${{ inputs.fixture_base64 }}
        run: node powerplatform/deployment/accept-role-only-sandbox.mjs before
      - name: One managed role-only import
        run: |
          set -euo pipefail
          PAC_CLI="${POWERPLATFORMTOOLS_PACPATH:-pac}"
          "$PAC_CLI" auth create --name jm1-pub-role-acceptance --applicationId 97891ed1-6623-487c-b890-633bea440e22 --tenant 352d075e-8e17-4169-9f8e-22e6946ce66d --githubFederated --environment https://jm1test.crm.dynamics.com
          "$PAC_CLI" solution import --environment https://jm1test.crm.dynamics.com --path /tmp/role-only-fixture.zip
      - name: Native normalization and protected-role parity
        run: node powerplatform/deployment/accept-role-only-sandbox.mjs after
      - name: Preserve terminal readback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: role-only-native-acceptance
          path: /tmp/role-only-acceptance.json
          if-no-files-found: error

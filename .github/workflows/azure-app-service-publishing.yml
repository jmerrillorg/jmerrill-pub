name: Publishing App Service CI/CD

on:
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: "Deployment scope"
        required: true
        default: "publishing_reference"
        type: choice
        options:
          - "publishing_reference"
          - "gate_w3_enterprise_minimal"
      deploy_production:
        description: "Deploy approved staging artifact to production after environment approval"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "infra/jm1-infra-006/app-service/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/azure-app-service-publishing.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publishing-app-service-${{ github.ref }}-staging
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  APP_SERVICE_PACKAGE: jmerrill-pub-appservice-${{ github.sha }}.zip
  AZURE_RESOURCE_GROUP: ${{ vars.JM1_PUB_APP_SERVICE_RESOURCE_GROUP }}
  AZURE_WEBAPP_NAME: ${{ vars.JM1_PUB_APP_SERVICE_NAME }}
  AZURE_STAGING_SLOT: staging
  STAGING_HEALTH_URL: https://app-jm1-pub-prod-staging.azurewebsites.net/api/health
  PRODUCTION_HEALTH_URL: https://jmerrill.pub/api/health

jobs:
  build:
    name: Build Immutable App Service Artifact
    if: github.event_name != 'workflow_dispatch' || inputs.deployment_scope == 'publishing_reference'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Certification Guards
        run: |
          set -euo pipefail
          node scripts/check-catalog-runtime-source.mjs
          node scripts/infra006_health_contract.test.mjs
          node scripts/program002_author_portal_access.test.mjs

      - name: Build Next Standalone Output
        env:
          JM1_RELEASE_SHA: ${{ github.sha }}
        run: npm run build

      - name: Package Standalone Artifact
        shell: bash
        run: |
          set -euo pipefail
          JM1_RELEASE_SHA="${{ github.sha }}" npm run package:appservice -- "${APP_SERVICE_PACKAGE}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmerrill-pub-appservice-${{ github.sha }}
          path: |
            ${{ env.APP_SERVICE_PACKAGE }}
            ${{ env.APP_SERVICE_PACKAGE }}.sha256
          if-no-files-found: error
          retention-days: 30

  deploy_staging:
    name: Deploy App Service Staging
    if: github.event_name != 'workflow_dispatch' || inputs.deployment_scope == 'publishing_reference'
    runs-on: ubuntu-latest
    needs: build
    environment: jmerrill-pub-staging
    timeout-minutes: 30
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: jmerrill-pub-appservice-${{ github.sha }}

      - name: Verify Artifact Checksum
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 -c "${APP_SERVICE_PACKAGE}.sha256"
          checksum="$(cut -d ' ' -f 1 "${APP_SERVICE_PACKAGE}.sha256")"
          echo "artifact_checksum=$checksum" >> "$GITHUB_ENV"
          echo "Artifact checksum: $checksum"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Guard App Service Staging Target
        shell: bash
        run: |
          set -euo pipefail
          : "${AZURE_RESOURCE_GROUP:?JM1_PUB_APP_SERVICE_RESOURCE_GROUP repository variable is required}"
          : "${AZURE_WEBAPP_NAME:?JM1_PUB_APP_SERVICE_NAME repository variable is required}"
          if [ "$AZURE_WEBAPP_NAME" != "app-jm1-pub-prod" ] || [ "$AZURE_STAGING_SLOT" != "staging" ]; then
            echo "Refusing to deploy outside app-jm1-pub-prod / staging." >&2
            exit 1
          fi
          app_id="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query id \
            --output tsv)"
          slot_id="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_STAGING_SLOT" \
            --query id \
            --output tsv)"
          echo "Target app: $app_id"
          echo "Target slot: $slot_id"
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_STAGING_SLOT" \
            --startup-file 'node server.js'
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_STAGING_SLOT" \
            --settings JM1_RELEASE_SHA="${{ github.sha }}" SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false WEBSITE_RUN_FROM_PACKAGE=1 WEBSITE_SKIP_NODE_MODULES_TAR=1 WEBSITE_WARMUP_PATH=/api/health WEBSITE_WARMUP_STATUSES=200 \
            --output none
          before_target_slot="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_STAGING_SLOT" \
            --query siteConfig.autoSwapSlotName \
            --output tsv)"
          if [ -n "$before_target_slot" ]; then
            echo "Disabling unexpected staging auto-swap target: $before_target_slot"
          fi
          az webapp deployment slot auto-swap \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_STAGING_SLOT" \
            --disable \
            --output none
          target_slot="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_STAGING_SLOT" \
            --query siteConfig.autoSwapSlotName \
            --output tsv)"
          if [ -n "$target_slot" ]; then
            echo "Staging auto-swap remains enabled for target: $target_slot" >&2
            exit 1
          fi

      - name: Deploy Immutable Artifact To Staging
        uses: azure/webapps-deploy@v3
        timeout-minutes: 12
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_STAGING_SLOT }}
          package: ${{ env.APP_SERVICE_PACKAGE }}

      - name: Restart And Capture Staging Deployment
        shell: bash
        run: |
          set -euo pipefail
          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_STAGING_SLOT"
          deployment_id="$(az webapp log deployment list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_STAGING_SLOT" \
            --query '[0].id' \
            --output tsv || true)"
          echo "deployment_id=$deployment_id" >> "$GITHUB_ENV"
          echo "Deployment ID: ${deployment_id:-not-reported}"

      - name: Staging Health Certification
        shell: bash
        run: |
          set -euo pipefail
          successes=0
          for attempt in {1..30}; do
            body="$(mktemp)"
            code="$(curl -fsS -o "$body" -w '%{http_code}' --max-time 20 "$STAGING_HEALTH_URL" || true)"
            if [ "$code" = "200" ] && node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (h.status !== 'ready' || h.release !== process.argv[2]) process.exit(1)" "$body" "${{ github.sha }}"; then
              successes=$((successes + 1))
              echo "Health probe $attempt succeeded for ${{ github.sha }} ($successes/10)."
              if [ "$successes" -ge 10 ]; then
                exit 0
              fi
            else
              successes=0
              echo "Health probe $attempt failed or release mismatch; resetting consecutive count."
            fi
            sleep 10
          done
          echo "Staging health did not reach 10 consecutive ready probes for ${{ github.sha }}." >&2
          exit 1

  promote_production:
    name: Promote Staging To Production
    runs-on: ubuntu-latest
    needs: deploy_staging
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_scope == 'publishing_reference' && inputs.deploy_production == 'true'
    environment: jmerrill-pub-production
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Swap Staging To Production
        run: |
          set -euo pipefail
          az webapp deployment slot swap \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_STAGING_SLOT" \
            --target-slot production

      - name: Production Observation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            body="$(mktemp)"
            code="$(curl -fsS -o "$body" -w '%{http_code}' --max-time 20 "$PRODUCTION_HEALTH_URL" || true)"
            if [ "$code" = "200" ] && node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (h.status !== 'ready') process.exit(1)" "$body"; then
              sleep 10
              continue
            fi
            echo "Production health failed after swap. Start governed swap-back." >&2
            az webapp deployment slot swap \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --slot "$AZURE_STAGING_SLOT" \
              --target-slot production
            exit 1
          done

  gate_w3_build_minimal:
    name: Build GATE-W3 Minimal Runtime Artifact
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_scope == 'gate_w3_enterprise_minimal'
    runs-on: ubuntu-latest
    env:
      GATE_W3_PACKAGE: jm1-gate-w3-minimal-runtime-${{ github.sha }}.zip
    steps:
      - name: Build Governed Minimal Runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate-w3-minimal-runtime
          cat > gate-w3-minimal-runtime/package.json <<'JSON'
          {
            "name": "jm1-gate-w3-minimal-runtime",
            "version": "1.0.0",
            "private": true,
            "type": "commonjs",
            "scripts": {
              "start": "node server.js"
            }
          }
          JSON
          cat > gate-w3-minimal-runtime/server.js <<'JS'
          const http = require("http");

          const port = Number(process.env.PORT || process.env.WEBSITES_PORT || 8080);
          const release = process.env.JM1_RELEASE_SHA || "unknown";
          const property = process.env.JM1_PROPERTY_DOMAIN || "unknown";
          const slot = process.env.JM1_SLOT_ENVIRONMENT || process.env.NODE_ENV || "unknown";

          function payload(path) {
            return {
              status: "ready",
              service: "JM1 Enterprise Web Platform",
              gate: "GATE-W3",
              property,
              slot,
              path,
              release,
              traffic_migrated: false,
              message: "Infrastructure Ready. Production traffic has not migrated."
            };
          }

          const server = http.createServer((request, response) => {
            if (request.url === "/" || request.url === "/api/health") {
              response.writeHead(200, {
                "content-type": "application/json; charset=utf-8",
                "cache-control": "no-store"
              });
              response.end(JSON.stringify(payload(request.url)));
              return;
            }

            response.writeHead(404, {
              "content-type": "application/json; charset=utf-8",
              "cache-control": "no-store"
            });
            response.end(JSON.stringify({ status: "not_found" }));
          });

          server.listen(port, "0.0.0.0", () => {
            console.log(`JM1 GATE-W3 minimal runtime listening on ${port}`);
          });
          JS
          (cd gate-w3-minimal-runtime && zip -qr "../${GATE_W3_PACKAGE}" package.json server.js)
          shasum -a 256 "${GATE_W3_PACKAGE}" | tee "${GATE_W3_PACKAGE}.sha256"

      - name: Upload GATE-W3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jm1-gate-w3-minimal-runtime-${{ github.sha }}
          path: |
            ${{ env.GATE_W3_PACKAGE }}
            ${{ env.GATE_W3_PACKAGE }}.sha256
          if-no-files-found: error
          retention-days: 30

  gate_w3_deploy_minimal:
    name: Deploy GATE-W3 Minimal Runtime
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_scope == 'gate_w3_enterprise_minimal'
    runs-on: ubuntu-latest
    needs: gate_w3_build_minimal
    environment: jmerrill-pub-staging
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app-jm1-fin-prod
            slot: production
            domain: jmerrill.financial
          - app: app-jm1-fin-prod
            slot: staging
            domain: jmerrill.financial
          - app: app-jm1-one-prod
            slot: production
            domain: jmerrill.one
          - app: app-jm1-one-prod
            slot: staging
            domain: jmerrill.one
          - app: app-jm1-foundation-prod
            slot: production
            domain: jmerrill.foundation
          - app: app-jm1-foundation-prod
            slot: staging
            domain: jmerrill.foundation
          - app: app-jm1-productions-prod
            slot: production
            domain: jmerrill.productions
          - app: app-jm1-productions-prod
            slot: staging
            domain: jmerrill.productions
          - app: app-jm1-jackiesmithjr-prod
            slot: production
            domain: jackiesmithjr.com
          - app: app-jm1-jackiesmithjr-prod
            slot: staging
            domain: jackiesmithjr.com
    env:
      GATE_W3_PACKAGE: jm1-gate-w3-minimal-runtime-${{ github.sha }}.zip
      GATE_W3_RESOURCE_GROUP: rg-jm1-web-prod-appsvc
    steps:
      - name: Download GATE-W3 Artifact
        uses: actions/download-artifact@v4
        with:
          name: jm1-gate-w3-minimal-runtime-${{ github.sha }}

      - name: Verify Artifact Checksum
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 -c "${GATE_W3_PACKAGE}.sha256"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Target Runtime
        shell: bash
        run: |
          set -euo pipefail
          slot_args=()
          if [ "${{ matrix.slot }}" != "production" ]; then
            slot_args=(--slot "${{ matrix.slot }}")
            az webapp deployment slot auto-swap \
              --resource-group "$GATE_W3_RESOURCE_GROUP" \
              --name "${{ matrix.app }}" \
              --slot "${{ matrix.slot }}" \
              --disable \
              --output none
          fi
          az webapp config set \
            --resource-group "$GATE_W3_RESOURCE_GROUP" \
            --name "${{ matrix.app }}" \
            "${slot_args[@]}" \
            --startup-file 'node server.js'
          az webapp config appsettings set \
            --resource-group "$GATE_W3_RESOURCE_GROUP" \
            --name "${{ matrix.app }}" \
            "${slot_args[@]}" \
            --settings JM1_RELEASE_SHA="${{ github.sha }}" JM1_WEB_GATE=GATE-W3 JM1_PROPERTY_DOMAIN="${{ matrix.domain }}" JM1_SLOT_ENVIRONMENT="${{ matrix.slot }}" SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false WEBSITE_RUN_FROM_PACKAGE=1 WEBSITE_SKIP_NODE_MODULES_TAR=1 WEBSITE_WARMUP_PATH=/api/health WEBSITE_WARMUP_STATUSES=200 \
            --output none

      - name: Deploy Minimal Runtime To Production Slot
        if: matrix.slot == 'production'
        uses: azure/webapps-deploy@v3
        timeout-minutes: 12
        with:
          app-name: ${{ matrix.app }}
          package: ${{ env.GATE_W3_PACKAGE }}

      - name: Deploy Minimal Runtime To Staging Slot
        if: matrix.slot != 'production'
        uses: azure/webapps-deploy@v3
        timeout-minutes: 12
        with:
          app-name: ${{ matrix.app }}
          slot-name: ${{ matrix.slot }}
          package: ${{ env.GATE_W3_PACKAGE }}

      - name: Restart Target
        shell: bash
        run: |
          set -euo pipefail
          slot_args=()
          if [ "${{ matrix.slot }}" != "production" ]; then
            slot_args=(--slot "${{ matrix.slot }}")
          fi
          az webapp restart \
            --resource-group "$GATE_W3_RESOURCE_GROUP" \
            --name "${{ matrix.app }}" \
            "${slot_args[@]}"

      - name: Runtime Certification
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [ "${{ matrix.slot }}" != "production" ]; then
            suffix="-${{ matrix.slot }}"
          fi
          base_url="https://${{ matrix.app }}${suffix}.azurewebsites.net"
          successes=0
          for attempt in {1..30}; do
            body="$(mktemp)"
            code="$(curl -fsS -o "$body" -w '%{http_code}' --max-time 20 "${base_url}/api/health" || true)"
            if [ "$code" = "200" ] && node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (h.status !== 'ready' || h.release !== process.argv[2] || h.gate !== 'GATE-W3' || h.traffic_migrated !== false) process.exit(1)" "$body" "${{ github.sha }}"; then
              successes=$((successes + 1))
              echo "${{ matrix.app }} / ${{ matrix.slot }} health probe $attempt succeeded ($successes/10)."
              if [ "$successes" -ge 10 ]; then
                root_body="$(mktemp)"
                root_code="$(curl -fsS -o "$root_body" -w '%{http_code}' --max-time 20 "${base_url}/" || true)"
                node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (h.status !== 'ready' || h.release !== process.argv[2] || h.path !== '/') process.exit(1)" "$root_body" "${{ github.sha }}"
                test "$root_code" = "200"
                exit 0
              fi
            else
              successes=0
              echo "${{ matrix.app }} / ${{ matrix.slot }} health probe $attempt failed or release mismatch; resetting consecutive count."
            fi
            sleep 10
          done
          echo "${{ matrix.app }} / ${{ matrix.slot }} did not reach 10 consecutive ready probes." >&2
          exit 1

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Guard catalog runtime source
        run: node scripts/check-catalog-runtime-source.mjs

      - name: Verify author portal session secret
        shell: bash
        env:
          AUTHOR_PORTAL_SESSION_SECRET: ${{ secrets.AUTHOR_PORTAL_SESSION_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AUTHOR_PORTAL_SESSION_SECRET:-}" ]; then
            echo "AUTHOR_PORTAL_SESSION_SECRET is required for author portal session signing." >&2
            exit 1
          fi
          if [ "$AUTHOR_PORTAL_SESSION_SECRET" = "jm1-author-portal-session" ]; then
            echo "AUTHOR_PORTAL_SESSION_SECRET must not use the former static fallback." >&2
            exit 1
          fi
          if [ "${#AUTHOR_PORTAL_SESSION_SECRET}" -lt 32 ]; then
            echo "AUTHOR_PORTAL_SESSION_SECRET must be at least 32 characters." >&2
            exit 1
          fi

      - name: Prepare author gate build environment
        shell: bash
        env:
          AUTHOR_ONBOARDING_ACCESS_CODE: ${{ secrets.AUTHOR_ONBOARDING_ACCESS_CODE }}
          AUTHOR_PORTAL_ACCESS_CODE_PEPPER: ${{ secrets.AUTHOR_PORTAL_ACCESS_CODE_PEPPER }}
          AUTHOR_PORTAL_ACCESS_RECORDS_JSON: ${{ secrets.AUTHOR_PORTAL_ACCESS_RECORDS_JSON }}
          AUTHOR_PORTAL_ACCESS_REGISTRY_JSON: ${{ secrets.AUTHOR_PORTAL_ACCESS_REGISTRY_JSON }}
          AUTHOR_PORTAL_MASTER_ACCESS_CODE: ${{ secrets.AUTHOR_PORTAL_MASTER_ACCESS_CODE }}
          AUTHOR_PORTAL_SESSION_SECRET: ${{ secrets.AUTHOR_PORTAL_SESSION_SECRET }}
        run: |
          umask 177
          cat > .env.production <<EOF
          AUTHOR_ONBOARDING_ACCESS_CODE=${AUTHOR_ONBOARDING_ACCESS_CODE}
          AUTHOR_PORTAL_ACCESS_CODE_PEPPER=${AUTHOR_PORTAL_ACCESS_CODE_PEPPER}
          AUTHOR_PORTAL_ACCESS_RECORDS_JSON=${AUTHOR_PORTAL_ACCESS_RECORDS_JSON}
          AUTHOR_PORTAL_ACCESS_REGISTRY_JSON=${AUTHOR_PORTAL_ACCESS_REGISTRY_JSON}
          AUTHOR_PORTAL_MASTER_ACCESS_CODE=${AUTHOR_PORTAL_MASTER_ACCESS_CODE}
          AUTHOR_PORTAL_SESSION_SECRET=${AUTHOR_PORTAL_SESSION_SECRET}
          EOF
          cat > lib/server/author-portal-access.generated.ts <<EOF
          export const GENERATED_AUTHOR_PORTAL_ACCESS = {
            onboardingAccessCode: ${AUTHOR_ONBOARDING_ACCESS_CODE@Q},
            accessCodePepper: ${AUTHOR_PORTAL_ACCESS_CODE_PEPPER@Q},
            accessRecordsJson: ${AUTHOR_PORTAL_ACCESS_RECORDS_JSON@Q},
            accessRegistryJson: ${AUTHOR_PORTAL_ACCESS_REGISTRY_JSON@Q},
            masterAccessCode: ${AUTHOR_PORTAL_MASTER_ACCESS_CODE@Q},
            sessionSecret: ${AUTHOR_PORTAL_SESSION_SECRET@Q},
          } as const
          EOF

      - name: Build and Deploy
        id: builddeploy
        uses: azure/static-web-apps-deploy@v1
        env:
          AUTHOR_ONBOARDING_ACCESS_CODE: ${{ secrets.AUTHOR_ONBOARDING_ACCESS_CODE }}
          AUTHOR_PORTAL_ACCESS_CODE_PEPPER: ${{ secrets.AUTHOR_PORTAL_ACCESS_CODE_PEPPER }}
          AUTHOR_PORTAL_ACCESS_RECORDS_JSON: ${{ secrets.AUTHOR_PORTAL_ACCESS_RECORDS_JSON }}
          AUTHOR_PORTAL_ACCESS_REGISTRY_JSON: ${{ secrets.AUTHOR_PORTAL_ACCESS_REGISTRY_JSON }}
          AUTHOR_PORTAL_MASTER_ACCESS_CODE: ${{ secrets.AUTHOR_PORTAL_MASTER_ACCESS_CODE }}
          AUTHOR_PORTAL_SESSION_SECRET: ${{ secrets.AUTHOR_PORTAL_SESSION_SECRET }}
          DATAVERSE_TENANT_ID: ${{ secrets.DATAVERSE_TENANT_ID }}
          DATAVERSE_CLIENT_ID: ${{ secrets.DATAVERSE_CLIENT_ID }}
          DATAVERSE_CLIENT_SECRET: ${{ secrets.DATAVERSE_CLIENT_SECRET }}
          DATAVERSE_RESOURCE_URL: ${{ secrets.DATAVERSE_RESOURCE_URL }}
          DATAVERSE_WEB_API_BASE_URL: ${{ secrets.DATAVERSE_WEB_API_BASE_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: ""

      - name: JM1-INFRA-005 Production Health Gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          JM1_PRODUCTION_HEALTH_BASE_URL: https://jmerrill.pub
          JM1_PRODUCTION_HEALTH_DURATION_SECONDS: "600"
          JM1_PRODUCTION_HEALTH_INTERVAL_SECONDS: "30"
          JM1_PRODUCTION_HEALTH_TIMEOUT_MS: "20000"
          JM1_PRODUCTION_HEALTH_EVIDENCE_PATH: deployment-evidence/production-health-gate.json
        run: node scripts/production_health_gate.mjs

      - name: Preserve JM1-INFRA-005 Deployment Evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jm1-infra-005-production-health
          path: deployment-evidence/
          if-no-files-found: error

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Close Pull Request Deployment
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify author portal session secret
        shell: bash
        env:
          AUTHOR_PORTAL_SESSION_SECRET: ${{ secrets.AUTHOR_PORTAL_SESSION_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AUTHOR_PORTAL_SESSION_SECRET:-}" ]; then
            echo "AUTHOR_PORTAL_SESSION_SECRET is required for author portal session signing." >&2
            exit 1
          fi
          if [ "$AUTHOR_PORTAL_SESSION_SECRET" = "jm1-author-portal-session" ]; then
            echo "AUTHOR_PORTAL_SESSION_SECRET must not use the former static fallback." >&2
            exit 1
          fi
          if [ "${#AUTHOR_PORTAL_SESSION_SECRET}" -lt 32 ]; then
            echo "AUTHOR_PORTAL_SESSION_SECRET must be at least 32 characters." >&2
            exit 1
          fi

      - name: Build and Deploy
        id: builddeploy
        uses: azure/static-web-apps-deploy@latest
        env:
          AUTHOR_PORTAL_SESSION_SECRET: ${{ secrets.AUTHOR_PORTAL_SESSION_SECRET }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Close Pull Request Deployment
        uses: azure/static-web-apps-deploy@latest
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close

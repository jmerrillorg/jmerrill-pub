name: Publishing Power Platform Solution Deploy

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: Power Platform solution unique name.
        required: true
        default: JM1PublishingSales
      solution_version:
        description: Expected solution version from source control.
        required: true
        default: 1.0.0.0
      target_environment:
        description: Deployment target.
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - production
      confirm:
        description: Confirm production import.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publishing-power-platform-solution-deploy-${{ inputs.solution_name }}
  cancel-in-progress: false

env:
  SOLUTION_PATH: powerplatform/solutions/JM1PublishingSales
  PROD_ENVIRONMENT_URL: https://jm1hq.crm.dynamics.com/

jobs:
  validate:
    name: Validate and package solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Repository Guards
        run: |
          set -euo pipefail
          npm ci
          npm run jm1-bootstrap-guard
          npm run jm1-canon-consistency-guard
          npm run jm1-canon-guard-enforcement
          npm run jm1-commissioning-guard
          npm run commercial-architecture-guard
          npm run slice3-implementation-planning-guard
          npm run jm1-power-platform-solution-lifecycle-guard

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack unmanaged validation artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOLUTION_PATH/artifacts/workflow"
          pac solution pack \
            --zipfile "$SOLUTION_PATH/artifacts/workflow/${{ inputs.solution_name }}_unmanaged.zip" \
            --folder "$SOLUTION_PATH/src" \
            --packagetype Unmanaged

      - name: Preserve validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: power-platform-solution-validation
          path: powerplatform/solutions/JM1PublishingSales/artifacts/workflow/*.zip
          if-no-files-found: error

  production-import:
    name: Protected production import
    needs: validate
    if: inputs.target_environment == 'production' && inputs.confirm == 'true'
    runs-on: ubuntu-latest
    environment: jm1-power-platform-production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Fail closed until federated PAC identity is commissioned
        run: |
          set -euo pipefail
          npm ci
          npm run jm1-power-platform-solution-lifecycle-guard
          # Commissioned production import command, enabled only after federated PAC identity is approved:
          # pac solution import --environment "$PROD_ENVIRONMENT_URL" --path "$SOLUTION_PATH/artifacts/workflow/${{ inputs.solution_name }}_managed.zip" --publish-changes
          echo "Production import requires governed federated PAC identity commissioning before activation." >&2
          exit 1
